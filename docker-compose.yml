services:
  app:
    build: .
    ports:
      - "17005:7001"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-storage:/app/storage
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_supervision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d security_supervision"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
  app-storage:
